# Backend supplied as an image by the NestJS team.
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY}
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      - backend
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the NestJS image}
    env_file: .env.backend
    environment:
      PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped
